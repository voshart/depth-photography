name: Pixel processor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shipped WASM and JavaScript
        run: |
          node tests/wasm.test.mjs
          node tests/boomerang.test.mjs
          node tests/detail-lookup.test.mjs
          node tests/preview-buffer.test.mjs
          node tests/preview-scheduler.test.mjs
      - name: Rebuild Rust WASM
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          sh scripts/build-wasm.sh
          node tests/wasm.test.mjs
          node tests/detail-lookup.test.mjs
          node tests/preview-buffer.test.mjs
